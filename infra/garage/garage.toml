# Garage на одном узле для чеков оплаты (ADR-017). Секреты не здесь, а в переменных окружения:
# GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN, ключ доступа и бакет - GARAGE_DEFAULT_ACCESS_KEY,
# _SECRET_KEY, _BUCKET.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
# на одном узле sqlite надёжнее LMDB при внезапном выключении
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

# admin API для панели garage-webui, только внутри сети compose; без токена закрыт
[admin]
api_bind_addr = "[::]:3903"
