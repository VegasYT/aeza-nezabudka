# Вся система на одном сервере: прокси с HTTPS, frontend, backend (api, worker, migrate),
# PostgreSQL и наблюдаемость. Запуск из корня репозитория, настройки и секреты - в infra/.env:
#   docker compose -f infra/compose.prod.yaml up -d --build --remove-orphans
#
# Наружу открыты только порты прокси (80 и 443): панель и API на <домен>,
# Grafana на grafana.<домен>, pgAdmin на pgadmin.<домен> и Kafka UI на kafka.<домен>
# (профиль integration) с входом по паролю (ADR-009).
# Подробности: infra/README.md.
name: nezabudka

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-backend: &backend
  <<: *restart
  build: ../backend
  image: nezabudka-backend

# Переменные api и worker (backend/.env.example): общие обоим процессам (ADR-010, ADR-011).
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://app:${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в infra/.env}@postgres:5432/app
  TZ: ${TZ:-Europe/Moscow}
  # development только для тестового стенда: с ним разрешён DEV_LOGIN_PASSWORD (ADR-014)
  APP_ENV: ${APP_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
  TELEGRAM_THREAD_ID: ${TELEGRAM_THREAD_ID:-}
  # кнопка "Открыть в панели" под сообщениями бота; пустой PUBLIC_URL убирает её:
  # адрес localhost Telegram в кнопках не принимает
  PUBLIC_URL: ${PUBLIC_URL-${SCHEME:-https}://${DOMAIN}}
  REMINDER_DAYS_BEFORE: ${REMINDER_DAYS_BEFORE:-3}
  WEBHOOK_URL: ${WEBHOOK_URL:-}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
  KAFKA_BROKERS: ${KAFKA_BROKERS:-}
  KAFKA_TOPIC: ${KAFKA_TOPIC:-invoice-keeper.events}

services:
  caddy:
    <<: *restart
    image: caddy:2.10-alpine
    environment:
      DOMAIN: ${DOMAIN:?задай DOMAIN в infra/.env}
      SCHEME: ${SCHEME:-https}
    # другие порты - только для локального запуска (infra/local.env), где 80 часто занят
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../docs/assets:/srv/media:ro
      # сертификаты хранятся между выкладками: иначе каждое пересоздание запрашивало бы их заново
      - caddy-data:/data
      - caddy-config:/config

  frontend:
    <<: *restart
    build:
      context: ../frontend
      dockerfile: ../infra/frontend/Dockerfile
    image: nezabudka-frontend

  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: app
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    # разовая задача: применяет миграции и завершается; api и worker ждут её успеха
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: ["python", "-m", "app.main"]
    environment:
      <<: *backend-env
      AEZA_API_URL: ${AEZA_API_URL:-https://my.aeza.ru/api}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?задай ADMIN_EMAILS в infra/.env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      DEV_LOGIN_PASSWORD: ${DEV_LOGIN_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Тестовые данные для демо, запуск вручную:
  #   docker compose -f infra/compose.prod.yaml run --rm seed
  seed:
    <<: *backend
    restart: "no"
    profiles: ["tools"]
    command: ["python", "-m", "app.seed"]
    environment:
      <<: *backend-env
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Брокер заказчика для демо встраивания (ADR-011), по умолчанию выключен:
  #   COMPOSE_PROFILES=integration и KAFKA_BROKERS=kafka:19092 в infra/.env
  kafka:
    <<: *restart
    profiles: ["integration"]
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # сервер небольшой: без ограничения Kafka занимает 1 ГБ памяти под кучу
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Просмотр топиков и сообщений Kafka на kafka.<домен>, только чтение, вход по паролю.
  kafka-ui:
    <<: *restart
    profiles: ["integration"]
    image: kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: nezabudka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_READONLY: "true"
      DYNAMIC_CONFIG_ENABLED: "false"
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:?задай KAFKA_UI_PASSWORD в infra/.env}
      JAVA_OPTS: -Xms128m -Xmx256m
    mem_limit: 512m
    depends_on:
      - kafka

  prometheus:
    <<: *restart
    # v3.15.0 падает на любом PromQL-запросе (fatal error в рантайме Go), в v3.15.1 исправлено
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 512m

  loki:
    <<: *restart
    build: ./loki
    image: nezabudka-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "-q", "--spider", "http://127.0.0.1:3100/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  promtail:
    <<: *restart
    image: grafana/promtail:3.6.11
    command: ["-config.file=/etc/promtail/promtail.yml", "-config.expand-env=true"]
    environment:
      COMPOSE_PROJECT: nezabudka
      LOG_ENVIRONMENT: production
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail-positions:/var/lib/promtail
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    <<: *restart
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?задай GRAFANA_ADMIN_PASSWORD в infra/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/backend.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${SCHEME:-https}://grafana.${DOMAIN}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy

  # Просмотр базы через браузер. Сервер "nezabudka" добавлен заранее, пароль базы - POSTGRES_PASSWORD;
  # servers.json читается только при первом запуске, на пустом томе.
  pgadmin:
    <<: *restart
    image: dpage/pgadmin4:9.18.0
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?задай PGADMIN_EMAIL в infra/.env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?задай PGADMIN_PASSWORD в infra/.env}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_DISABLE_POSTFIX: "true"
      # за Caddy: адрес, схема и хост берутся из заголовков X-Forwarded-*
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: 1
      # блокировка после неудачных входов дала бы любому запереть администратора; пароль длинный
      PGADMIN_CONFIG_MAX_LOGIN_ATTEMPTS: 0
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  loki-data:
  promtail-positions:
  grafana-data:
  caddy-data:
  caddy-config:
  pgadmin-data:
