openapi: 3.1.0
info:
  title: Незабудка API
  description: "\nНапоминания о регулярных платежах компании: аренда, подписки, серверы.\nПлатёж порождает\
    \ ежемесячные **периоды**, у каждого свой срок и своя отметка оплаты.\n\n### Вход\n1. `POST /auth/login`\
    \ - email и пароль аккаунта Aéza.\n2. `POST /auth/use-challenge` или, если в `requirements` есть `totp`,\
    \ `POST /auth/tfa/totp`.\n3. Полученный `session` - в **Authorize**, схема `bearer`.\n   Другие системы\
    \ передают `X-API-KEY` аккаунта Aéza.\n\nВойти могут только участники белого списка. Роли: `admin`\
    \ - всё; `user` - просмотр и отметка оплаты;\n`integration` - платежи и оплаты по `X-API-KEY`, без\
    \ входа в панель.\n\n### Формат\n- JSON в camelCase. Списки - `{items, total}`, параметры `limit`\
    \ (до 100) и `offset`.\n- Суммы - целые копейки или центы (`amountMinor`), итоги по каждой валюте\
    \ отдельно.\n- Даты - `ГГГГ-ММ-ДД` в часовом поясе системы, серверное сегодня - `GET /settings`.\n\
    - `POST /recurring-payments` принимает `Idempotency-Key`: повтор не создаёт второй платёж.\n\n###\
    \ Ошибки\n`{statusCode, message, error, timestamp, path, payload, requestId}`,\nгде `error` - код\
    \ для программы.\n400 `bad_request` - в `payload` список `{field, message}`; 401 `not_auth`; 403 `forbidden`;\n\
    404 `not_found`; 409 - конфликт с кодом в `error`; 429 - много неудачных входов.\n"
  version: 0.1.0
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Вход
      summary: 'Вход аккаунтом Aéza: шаг 1'
      description: Email и пароль аккаунта Aéza, как `POST /api/v2/auth/login` у Aéza. Ответ - `challenge`
        и `requirements` от Aéza. Пустой `requirements` - дальше `POST /auth/use-challenge`, иначе код
        2FA в `POST /auth/tfa/totp`. 400 `invalid_credentials` - неверный email или пароль.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginChallengeResponse'
        '400':
          description: 'Ошибка проверки данных: список полей в `payload`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Слишком много попыток, повторите позже (заголовок Retry-After)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Сервис входа Aéza временно недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/use-challenge:
    post:
      tags:
      - Вход
      summary: 'Вход: шаг 2 без 2FA'
      description: Меняет `challenge` на токен сессии. 403 `not_a_member` - аккаунта нет в белом списке;
        400 `invalid_challenge` - срок входа истёк.
      operationId: use_challenge
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UseChallengeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: 'Ошибка проверки данных: список полей в `payload`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Слишком много попыток, повторите позже (заголовок Retry-After)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Сервис входа Aéza временно недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/tfa/totp:
    post:
      tags:
      - Вход
      summary: 'Вход: шаг 2 с кодом 2FA'
      description: '`challenge` и код 2FA аккаунта Aéza. 400 `invalid_code` - неверный код.'
      operationId: submit_totp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: 'Ошибка проверки данных: список полей в `payload`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Слишком много попыток, повторите позже (заголовок Retry-After)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Сервис входа Aéza временно недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - Вход
      summary: Выход
      description: Сессия удаляется, токен больше не действует.
      operationId: logout
      responses:
        '204':
          description: Successful Response
        '401':
          description: Нет действующего токена (`not_auth`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer: []
      - X-API-KEY: []
  /api/v1/auth/me:
    get:
      tags:
      - Вход
      summary: Текущий участник
      description: Email и роль владельца токена или ключа.
      operationId: get_current_user
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          description: Нет действующего токена (`not_auth`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearer: []
      - X-API-KEY: []
  /api/v1/users:
    get:
      tags:
      - Пользователи
      summary: Белый список
      description: Участники с ролями `user` и `integration` по алфавиту email; администраторы из настроек
        не показываются. Только администратор.
      operationId: list_users
      security:
      - bearer: []
      - X-API-KEY: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Сколько элементов вернуть
          default: 50
          title: Limit
        description: Сколько элементов вернуть
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Сколько элементов пропустить
          default: 0
          title: Offset
        description: Сколько элементов пропустить
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_User_'
        '400':
          description: 'Ошибка проверки данных: список полей в `payload`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Нет действующего токена (`not_auth`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Пользователи
      summary: Добавить участника
      description: Email аккаунта Aéza и роль. Участник сразу может войти своим аккаунтом Aéza. Email
        уже в списке - 409 `login_taken`. Только администратор.
      operationId: create_user
      security:
      - bearer: []
      - X-API-KEY: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: 'Ошибка проверки данных: список полей в `payload`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Нет действующего токена (`not_auth`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Операция невозможна в текущем состоянии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users/{user_id}:
    patch:
      tags:
      - Пользователи
      summary: Изменить участника
      description: Роль или включение. Отключение и смена роли сразу завершают сессии участника. Администратора
        из настроек изменить нельзя - 409 `admin_protected`.
      operationId: update_user
      security:
      - bearer: []
      - X-API-KEY: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: 'Ошибка проверки данных: список полей в `payload`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Нет действующего токена (`not_auth`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Объект не найден (`not_found`, в `payload` - `entity` и `id`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Операция невозможна в текущем состоянии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Пользователи
      summary: Удалить участника
      description: Сессии и привязка Telegram удаляются, история оплат сохраняется с email. Администратора
        из настроек удалить нельзя - 409 `admin_protected`.
      operationId: delete_user
      security:
      - bearer: []
      - X-API-KEY: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '204':
          description: Successful Response
        '400':
          description: 'Ошибка проверки данных: список полей в `payload`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Нет действующего токена (`not_auth`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Объект не найден (`not_found`, в `payload` - `entity` и `id`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Операция невозможна в текущем состоянии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/recurring-payments:
    get:
      tags:
      - Регулярные платежи
      summary: Список регулярных платежей
      description: 'По названию. Фильтры: статус, отдел (`none` - без отдела), поиск `q`.'
      operationId: list_recurring_payments
      security:
      - bearer: []
      - X-API-KEY: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Сколько элементов вернуть
          default: 50
          title: Limit
        description: Сколько элементов вернуть
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Сколько элементов пропустить
          default: 0
          title: Offset
        description: Сколько элементов пропустить
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/RecurringPaymentStatus'
          - type: 'null'
          description: Без фильтра - все
          title: Status
        description: Без фильтра - все
      - name: departmentId
        in: query
        required: false
        schema:
          anyOf:
          - anyOf:
            - type: string
              format: uuid
            - const: none
              type: string
            description: id отдела или `none` - только платежи без отдела
          - type: 'null'
          title: Departmentid
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 200
            description: Часть названия платежа, без учёта регистра
            examples:
            - аренда
          - type: 'null'
          title: Q
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_RecurringPayment_'
        '400':
          description: 'Ошибка проверки данных: список полей в `payload`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Нет действующего токена (`not_auth`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Регулярные платежи
      summary: Создать регулярный платёж
      description: Создаёт периоды до ближайшего будущего. Если до срока 3 дня или меньше, напоминание
        уходит сразу. Только администратор.
      operationId: create_recurring_payment
      security:
      - bearer: []
      - X-API-KEY: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
          description: Повтор запроса с тем же ключом не создаёт платёж второй раз
          title: Idempotency-Key
        description: Повтор запроса с тем же ключом не создаёт платёж второй раз
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringPaymentCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringPayment'
        '400':
          description: 'Ошибка проверки данных: список полей в `payload`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Нет действующего токена (`not_auth`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/recurring-payments/{payment_id}:
    get:
      tags:
      - Регулярные платежи
      summary: Регулярный платёж
      description: С ближайшим сроком и просрочкой.
      operationId: get_recurring_payment
      security:
      - bearer: []
      - X-API-KEY: []
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Payment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringPayment'
        '400':
          description: 'Ошибка проверки данных: список полей в `payload`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Нет действующего токена (`not_auth`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Объект не найден (`not_found`, в `payload` - `entity` и `id`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Регулярные платежи
      summary: Изменить регулярный платёж
      description: Меняются только неоплаченные периоды со сроком сегодня или позже; оплаченные и просроченные
        остаются как были. Прекращённый платёж изменить нельзя (409). Только администратор.
      operationId: update_recurring_payment
      security:
      - bearer: []
      - X-API-KEY: []
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Payment Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringPaymentUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringPayment'
        '400':
          description: 'Ошибка проверки данных: список полей в `payload`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Нет действующего токена (`not_auth`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Объект не найден (`not_found`, в `payload` - `entity` и `id`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Операция невозможна в текущем состоянии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Регулярные платежи
      summary: Прекратить регулярный платёж
      description: 'История сохраняется, неоплаченные периоды со сроком позже сегодня и их напоминания
        удаляются. Неоплаченный период со сроком сегодня и просроченные остаются: их всё ещё нужно оплатить.
        Уже прекращённый - 409 `payment_stopped`. Только администратор.'
      operationId: stop_recurring_payment
      security:
      - bearer: []
      - X-API-KEY: []
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Payment Id
      responses:
        '204':
          description: Successful Response
        '400':
          description: 'Ошибка проверки данных: список полей в `payload`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Нет действующего токена (`not_auth`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Объект не найден (`not_found`, в `payload` - `entity` и `id`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Операция невозможна в текущем состоянии
          content:
