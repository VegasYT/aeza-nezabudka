        code:
          type: string
          maxLength: 16
          minLength: 1
          title: Code
          description: Код 2FA
          examples:
          - '123456'
      additionalProperties: false
      type: object
      required:
      - challenge
      - code
      title: TotpRequest
    UseChallengeRequest:
      properties:
        challenge:
          type: string
          maxLength: 512
          minLength: 1
          title: Challenge
      additionalProperties: false
      type: object
      required:
      - challenge
      title: UseChallengeRequest
    User:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          examples:
          - 5b1d2c3e-4f5a-6b7c-8d9e-0f1a2b3c4d5e
        email:
          type: string
          title: Email
          examples:
          - buh.petrova@company.ru
        role:
          $ref: '#/components/schemas/Role'
        enabled:
          type: boolean
          title: Enabled
          description: Может ли участник входить
          examples:
          - true
        editable:
          type: boolean
          title: Editable
          description: 'false - администратор из настроек: панель его не меняет и не удаляет'
          examples:
          - true
        linked:
          type: boolean
          title: Linked
          description: Участник уже входил, аккаунт Aéza привязан
          examples:
          - true
        createdAt:
          type: string
          format: date-time
          title: Createdat
        lastLoginAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Lastloginat
        lastSeenAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Lastseenat
          description: Последний вход или запрос по X-API-KEY, с точностью до минуты
      type: object
      required:
      - id
      - email
      - role
      - enabled
      - editable
      - linked
      - createdAt
      - lastLoginAt
      - lastSeenAt
      title: User
      description: Участник белого списка.
    UserCreate:
      properties:
        email:
          type: string
          maxLength: 255
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
          title: Email
          description: Email аккаунта Aéza
          examples:
          - buh.petrova@company.ru
        role:
          $ref: '#/components/schemas/MemberRole'
          default: user
      additionalProperties: false
      type: object
      required:
      - email
      title: UserCreate
      examples:
      - email: buh.petrova@company.ru
        role: user
    UserUpdate:
      properties:
        role:
          anyOf:
          - $ref: '#/components/schemas/MemberRole'
          - type: 'null'
        enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enabled
      additionalProperties: false
      type: object
      title: UserUpdate
      examples:
      - enabled: false
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    bearer:
      type: http
      description: '`session` из `POST /auth/use-challenge` или `tfa/totp`, без слова Bearer.'
      scheme: bearer
    X-API-KEY:
      type: apiKey
      description: Ключ аккаунта Aéza из кабинета ("API ключи") для других систем.
      in: header
      name: X-API-KEY
