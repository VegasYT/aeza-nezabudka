components:
  schemas:
    AuditEntry:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        at:
          type: string
          format: date-time
          title: At
        actorLogin:
          type: string
          title: Actorlogin
          examples:
          - glavbuh@company.ru
        action:
          type: string
          title: Action
          examples:
          - payment.updated
        entity:
          type: string
          title: Entity
          examples:
          - payment
        entityId:
          anyOf:
          - type: string
          - type: 'null'
          title: Entityid
        entityName:
          anyOf:
          - type: string
          - type: 'null'
          title: Entityname
          description: Название на момент действия; null у старых записей
          examples:
          - Аренда офиса
        details:
          additionalProperties: true
          type: object
          title: Details
          description: Подробности, ключи в camelCase
      type: object
      required:
      - id
      - at
      - actorLogin
      - action
      - entity
      - entityId
      - entityName
      - details
      title: AuditEntry
    Currency:
      type: string
      enum:
      - RUB
      - USD
      - EUR
      title: Currency
    CurrencyTotals:
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        totalMinor:
          type: integer
          minimum: 0.0
          title: Totalminor
          examples:
          - 15000000
        paidMinor:
          type: integer
          minimum: 0.0
          title: Paidminor
          examples:
          - 0
        unpaidMinor:
          type: integer
          minimum: 0.0
          title: Unpaidminor
          examples:
          - 15000000
        overdueMinor:
          type: integer
          minimum: 0.0
          title: Overdueminor
          description: Часть неоплаченного
          examples:
          - 0
        count:
          type: integer
          minimum: 0.0
          title: Count
          description: Сколько периодов
          examples:
          - 1
        paidCount:
          type: integer
          minimum: 0.0
          title: Paidcount
          description: Сколько оплачено
          examples:
          - 0
        unpaidCount:
          type: integer
          minimum: 0.0
          title: Unpaidcount
          description: Сколько не оплачено
          examples:
          - 1
        overdueCount:
          type: integer
          minimum: 0.0
          title: Overduecount
          description: Сколько просрочено, часть неоплаченных
          examples:
          - 1
        plannedMinor:
          type: integer
          minimum: 0.0
          title: Plannedminor
          description: Сумма плановых периодов, только с includePlanned
          default: 0
        plannedCount:
          type: integer
          minimum: 0.0
          title: Plannedcount
          description: Сколько плановых периодов
          default: 0
      type: object
      required:
      - currency
      - totalMinor
      - paidMinor
      - unpaidMinor
      - overdueMinor
      - count
      - paidCount
      - unpaidCount
      - overdueCount
      title: CurrencyTotals
    CurrentUser:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          examples:
          - 2f6c4a1e-8d3b-4c5a-9e7f-1a2b3c4d5e6f
        email:
          type: string
          title: Email
          examples:
          - buh.petrova@company.ru
        role:
          $ref: '#/components/schemas/Role'
          description: 'Роль: администратор, пользователь или внешняя система'
      type: object
      required:
      - id
      - email
      - role
      title: CurrentUser
    Department:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          examples:
          - 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
          examples:
          - Офис
        paymentsCount:
          type: integer
          minimum: 0.0
          title: Paymentscount
          description: Сколько действующих платежей
          examples:
          - 2
      type: object
      required:
      - id
      - name
      - paymentsCount
      title: Department
    DepartmentRef:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          examples:
          - 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        name:
          type: string
          title: Name
          examples:
          - Офис
      type: object
      required:
      - id
      - name
      title: DepartmentRef
      description: Отдел внутри других ответов.
    DepartmentWrite:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
          examples:
          - Офис
      additionalProperties: false
      type: object
      required:
      - name
      title: DepartmentWrite
      examples:
      - name: Офис
    ErrorResponse:
      properties:
        statusCode:
          type: integer
          title: Statuscode
          examples:
          - 400
        message:
          type: string
          title: Message
          examples:
          - Проверьте введённые данные
        error:
          type: string
          title: Error
          examples:
          - bad_request
        timestamp:
          type: string
          title: Timestamp
          examples:
          - '2026-10-24T14:09:29.458Z'
        path:
          type: string
          title: Path
          examples:
          - /api/v1/recurring-payments
        payload:
          anyOf:
          - items:
              $ref: '#/components/schemas/FieldError'
            type: array
          - additionalProperties: true
            type: object
          - type: string
          title: Payload
          description: Список полей для 400, `{entity, id}` для 404, иначе текст ошибки
        requestId:
          anyOf:
          - type: string
          - type: 'null'
          title: Requestid
          description: Совпадает с заголовком X-Request-ID
      type: object
      required:
      - statusCode
      - message
      - error
      - timestamp
      - path
      - payload
      title: ErrorResponse
      description: 'Ответ с ошибкой как у Aéza v2: `error` для программы, `message` для человека.'
    FieldError:
      properties:
        field:
          type: string
          title: Field
          examples:
          - nextDueDate
        message:
          type: string
          title: Message
          examples:
          - Дата ближайшей оплаты не может быть раньше сегодняшней
      type: object
      required:
      - field
      - message
      title: FieldError
    GroupChat:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        title:
          type: string
          title: Title
          description: Название группы в Telegram
          examples:
          - Бухгалтерия
        threadId:
          anyOf:
          - type: integer
          - type: 'null'
          title: Threadid
          description: Тема супергруппы; null - сообщения без темы
          examples:
          - 7
        topicName:
          anyOf:
          - type: string
          - type: 'null'
          title: Topicname
          description: Название темы
          examples:
          - Аренда
        departmentIds:
          anyOf:
          - items:
              type: string
              format: uuid
            type: array
          - type: 'null'
          title: Departmentids
          description: Отделы, по платежам которых приходят напоминания; null - все платежи
        blocked:
          type: boolean
          title: Blocked
          description: 'Бота удалили из группы: напоминания не идут до повторного подключения'
          examples:
          - false
        linkedAt:
          type: string
          format: date-time
          title: Linkedat
          description: Когда группа подключена
      type: object
      required:
      - id
      - title
      - threadId
      - topicName
      - departmentIds
      - blocked
      - linkedAt
      title: GroupChat
      description: 'Подключение группы: без темы или к одной теме супергруппы.'
    GroupChatLink:
      properties:
        url:
          type: string
          title: Url
          description: 'Добавить бота в группу: сообщения пойдут без темы'
          examples:
          - https://t.me/invoice_keeper_bot?startgroup=Zx81kQ
        command:
          type: string
          title: Command
          description: 'Отправить в теме группы, где бот уже есть: подключит эту тему'
          examples:
          - /start@invoice_keeper_bot Zx81kQ
        expiresAt:
          type: string
          format: date-time
          title: Expiresat
          description: Когда код перестанет действовать
      type: object
      required:
      - url
      - command
      - expiresAt
      title: GroupChatLink
    GroupChatUpdate:
      properties:
        departmentIds:
          anyOf:
          - items:
              type: string
              format: uuid
            type: array
            maxItems: 100
            minItems: 1
          - type: 'null'
          title: Departmentids
          description: null - все платежи, список - только платежи этих отделов
      additionalProperties: false
      type: object
      required:
      - departmentIds
      title: GroupChatUpdate
      examples:
      - {}
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoginChallengeResponse:
      properties:
        challenge:
